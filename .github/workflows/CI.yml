name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms on PR; ubuntu only on push to main (windows
        # already validated by the PR run, and saves the 2x runner cost).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          (Import-PowerShellDataFile ./Plumber.psd1).ModuleList |
              ForEach-Object {
                $installSplat = @{
                  Name               = $_.ModuleName
                  RequiredVersion    = $_.ModuleVersion
                  Scope              = 'CurrentUser'
                  Force              = $true
                  SkipPublisherCheck = $true
                }
                Install-Module @installSplat
              }
          $releaseSplat = @{
            Name               = 'Plumber.Release'
            RequiredVersion    = '0.1.0'
            Scope              = 'CurrentUser'
            Force              = $true
            SkipPublisherCheck = $true
          }
          Install-Module @releaseSplat

      - name: Invoke-Plumber
        shell: pwsh
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -OutputMode CI

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          (Import-PowerShellDataFile ./Plumber.psd1).ModuleList |
              ForEach-Object {
                $installSplat = @{
                  Name               = $_.ModuleName
                  RequiredVersion    = $_.ModuleVersion
                  Scope              = 'CurrentUser'
                  Force              = $true
                  SkipPublisherCheck = $true
                }
                Install-Module @installSplat
              }
          $releaseSplat = @{
            Name               = 'Plumber.Release'
            RequiredVersion    = '0.1.0'
            Scope              = 'CurrentUser'
            Force              = $true
            SkipPublisherCheck = $true
          }
          Install-Module @releaseSplat

      - name: Run Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          GITHUB_RELEASE_CONFIRM: true
          PSGALLERY_PUBLISH_CONFIRM: true
        run: |
          $repositoryStore = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'PSResourceGet'
          New-Item -Path $repositoryStore -ItemType Directory -Force | Out-Null
          $repository = Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue
          if (-not $repository) {
            Register-PSResourceRepository -PSGallery
          }
          Set-PSResourceRepository -Name PSGallery -Trusted

          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -Task Release -OutputMode CI

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Check matrix result
        shell: pwsh
        run: |
          if ('${{ needs.test.result }}' -ne 'success') {
            throw 'Validation matrix failed.'
          }

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          (Import-PowerShellDataFile ./Plumber.psd1).ModuleList |
              ForEach-Object {
                Install-Module `
                  -Name $_.ModuleName `
                  -RequiredVersion $_.ModuleVersion `
                  -Scope CurrentUser `
                  -Force `
                  -SkipPublisherCheck
              }
          Install-Module `
            -Name Plumber.Release `
            -RequiredVersion 0.1.0 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

      - name: Invoke-Plumber
        shell: pwsh
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -OutputMode CI

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          (Import-PowerShellDataFile ./Plumber.psd1).ModuleList |
              ForEach-Object {
                Install-Module `
                  -Name $_.ModuleName `
                  -RequiredVersion $_.ModuleVersion `
                  -Scope CurrentUser `
                  -Force `
                  -SkipPublisherCheck
              }
          Install-Module `
            -Name Plumber.Release `
            -RequiredVersion 0.1.0 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

      - name: Run Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          GITHUB_RELEASE_CONFIRM: true
          PSGALLERY_PUBLISH_CONFIRM: true
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Build -File ./Plumber.build.ps1 Release

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check matrix result
        shell: pwsh
        run: |
          if ('${{ needs.test.result }}' -ne 'success') {
            throw 'Validation matrix failed.'
          }

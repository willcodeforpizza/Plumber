name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Import-Module ./Plumber.psd1 -Force
          Install-PlumberDependency
          Install-PlumberDependency -Build -Path .

      - name: Invoke-Plumber
        shell: pwsh
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -OutputMode CI

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Import-Module ./Plumber.psd1 -Force
          Install-PlumberDependency
          Install-PlumberDependency -Build -Path .

      - name: Validate
        shell: pwsh
        env:
          PLUMBER_RELEASE_INTENT: true
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -OutputMode CI

      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -Task PublishTaggedRelease -OutputMode CI

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Check matrix result
        shell: pwsh
        run: |
          if ('${{ needs.test.result }}' -ne 'success') {
            throw 'Validation matrix failed.'
          }

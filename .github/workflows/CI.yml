name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          (Import-PowerShellDataFile ./Plumber.psd1).ModuleList |
              ForEach-Object {
                $installSplat = @{
                  Name           = $_.ModuleName
                  MinimumVersion = $_.ModuleVersion
                  Scope          = 'CurrentUser'
                  Force          = $true
                }
                Install-Module @installSplat
              }

      - name: Invoke-Plumber
        shell: pwsh
        run: |
          Import-Module ./Plumber.psd1 -Force
          Invoke-Plumber -OutputMode CI
